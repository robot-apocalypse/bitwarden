services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - vw-data:/data
    environment:
      - DOMAIN
      - ADMIN_TOKEN
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED:-false}
      - SHOW_PASSWORD_HINT=false
      - PUSH_ENABLED=${PUSH_ENABLED:-false}
      - IP_HEADER=X-Real-IP
      - ROCKET_ADDRESS=0.0.0.0
      - ROCKET_PORT=80
      - LOG_FILE=/data/vaultwarden.log
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - EXTENDED_LOGGING=true
    networks:
      - proxy

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-certs:/root/.caddy
    environment:
      - ACME_AGREE=true
      - DOMAIN
      - EMAIL
    networks:
      - proxy
    depends_on:
      - vaultwarden

  backup:
    image: jmqm/vaultwarden_backup:latest
    container_name: vaultwarden_backup
    restart: unless-stopped
    volumes:
      - vw-data:/data:ro
      - ./backups:/backups
    environment:
      # Required by the image. Without these the cron job cannot write to
      # /backups and tar fails with "Permission denied" -- while the log
      # still prints "New backup created". 0:0 matches the root-owned
      # ./backups dir and can read every file in the root-owned /data mount.
      - UID=0
      - GID=0
      - DELETE_AFTER=30
      - CRON_TIME=0 3 * * *
      - TZ=America/Denver
      - BACKUP_ADD_ATTACHMENTS=true
      - BACKUP_ADD_SENDS=true
      - BACKUP_ADD_CONFIG=true
      - BACKUP_ADD_RSA_KEY=true
    network_mode: none

  # Watchtower removed 2026-08-17. containrrr/watchtower is unmaintained and
  # broke against the Docker API (client 1.25 vs required 1.44), silently
  # updating nothing for four months while clients auto-updated past the
  # server. Replaced by the host-side systemd timer vaultwarden-update.timer
  # (/usr/local/bin/vaultwarden-update.sh), which takes a verified WAL-safe
  # backup before updating and fails loudly. See docs/upgrade-runbook.md.

networks:
  proxy:
    driver: bridge

volumes:
  vw-data:
    name: vaultwarden_data
  caddy-data:
    name: caddy_data
  caddy-certs:
    name: caddy_certs
