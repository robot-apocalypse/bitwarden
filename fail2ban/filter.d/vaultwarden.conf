# Matches vaultwarden 1.37 log lines, e.g.
# [2026-08-17 15:30:25.145][vaultwarden::api::identity][ERROR] Username or password is incorrect. Try again. IP: 203.0.113.7. Username: x.
[Definition]
failregex = ^.*Username or password is incorrect\. Try again\. IP: <ADDR>\. Username:
            ^.*Invalid admin token\. IP: <ADDR>
ignoreregex =
